name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & manifest invariants (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the declared floor (package.json engines) even though it is
        # past end-of-life; 22 and 24 are the current LTS lines.
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The source OAS (specs/) is gitignored, so CI verifies the committed
      # catalog artifacts instead of regenerating them.
      - name: Validate catalog
        run: npm run validate

      - name: Verify tools manifest invariants
        run: npm test
