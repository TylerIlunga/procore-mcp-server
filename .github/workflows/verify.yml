name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & manifest invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # The source OAS (specs/) is gitignored, so CI verifies the committed
      # catalog artifacts instead of regenerating them.
      - name: Validate catalog
        run: npm run validate

      - name: Verify tools manifest invariants
        run: npm test
