# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so they don't flood the queue; majors arrive individually so each
# can be reviewed on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Keep Node's type definitions on the oldest supported runtime
      # (package.json engines: >=20), so the compiler rejects APIs that
      # Node 20 doesn't have. Bump this major together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
